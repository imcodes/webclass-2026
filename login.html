<!DOCTYPE html>
<html lang="en" data-bs-theme='light'>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="assets/vendors/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <main class="container d-flex flex-column align-items-center justify-content-center vh-100">
        <h1 class="h3">Welcome to my Auth App</h1>
        <h2 class="h6">Login to your account</h2>
        <div class="w-100 borde border-2  rounded-5 p-4 border-primary shadow" style="max-width: 400px;">
            <form action="#">
                <div class="mb-3">
                    <label class="form-label" for="username">Username:</label>
                    <input class="form-control" type="text" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password:</label>
                    <input class="form-control" type="password" id="password" name="password" required>
                </div>
                <div class="d-flex flex-column flex-md-row  justify-content-between align-items-center gap-3 mb-3">
                    <button class="btn btn-primary" type="submit">Login</button>
                    <p class="mt-2">Don't have an account, <a href="register.html">Register</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
