<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration-Form</title>
    <link rel="stylesheet" href="assets/vendors/bootstrap-5.3.8-dist/css/bootstrap.min.css">

</head>

<body>
    <main class="container d-flex flex-column align-items-center justify-content-center">
        <header class="text-center mb-4 bg-primary text-white p-3">
            <h4>LOGO</h4>
            <h1>MOMENTS TREASURED</h1>
            <h6>[Your Company Number] [Your Company Email] [Your Company Website]</h6>
        </header>
        <div class="w-100 border border-2 p-4" style="max-width: 600px;">
            <h3>Registration Form</h3>
            <h5>Please fill out this form to register.</h5>
        </div>
        <div class="w-100 border border-2  p-4 " style="max-width: 600px;">
            <form>
                <div class="d-flex flex-row gap-3">
                    <div class="mb-3">
                        <label class="form-label" for="firstname">Firstname:</label>
                        <input class="form-control" type="text" id="firstname" name="firstname" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="lastname">Lastname:</label>
                        <input class="form-control" type="text" id="lastname" name="lastname" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email:</label>
                    <input class="form-control" type="email" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone">Phone number:</label>
                    <input class="form-control" type="tel" id="phone" name="phone" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="date_of_birth">Date of Birth:</label>
                    <input class="form-control" type="date" id="date_of_birth" name="date_of_birth" required>
                </div>
                <p>Gender</p>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="male" name="gender" value="male">
                    <label class="form-check-label" for="male">Male</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="female" name="gender" value="female">
                    <label class="form-check-label" for="female">Female</label>
                </div>
                <div class="m-3 d-flex gap-3 flex-md-row flex-column justify-content-between">
                    <button class="btn btn-primary" type="submit">Register</button>
                    <p class="mt-2">Already have an account? <a href="login.html">Login</a>.</p>
                </div>


            </form>
        </div>
    </main>
</body>

</html>
